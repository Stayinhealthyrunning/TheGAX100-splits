name: GAX100 source-confirmed result classification audit
on:
  push:
    branches: [fix/gax100-comprehensive-results-audit-2026-11-20]
    paths:
      - scripts/enrich_official_race_classifications.py
      - .github/workflows/source-classification-audit.yml
permissions:
  contents: write
jobs:
  match-public-source:
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install HTML parser
        run: python -m pip install --disable-pip-version-check beautifulsoup4==4.12.3
      - name: Match explicit DUV race classes against ALREADY released result IDs
        run: python3 -B scripts/enrich_official_race_classifications.py
      - name: Commit source-confirmed classification overlay to the release branch
        shell: bash
        run: |
          set -euo pipefail
          if git diff --quiet -- docs/data/official-result-classification.json; then
            echo "No new source-verified classification rows were available"
            exit 0
          fi
          git config user.name "GAX100 Release QA"
          git config user.email "gax100-release@users.noreply.github.com"
          git add docs/data/official-result-classification.json
          git commit -m "data(gax): source-confirmed classifications for public finishers"
          git pull --rebase origin fix/gax100-comprehensive-results-audit-2026-11-20
          git push origin HEAD:fix/gax100-comprehensive-results-audit-2026-11-20
