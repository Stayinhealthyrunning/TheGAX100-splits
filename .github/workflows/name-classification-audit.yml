name: GAX100 high-confidence first-name statistics audit
on:
  push:
    branches: [fix/gax100-comprehensive-results-audit-2026-11-20]
    paths:
      - scripts/enrich_name_based_classification.py
      - .github/workflows/name-classification-audit.yml
permissions:
  contents: write
jobs:
  verify-name-statistics:
    runs-on: ubuntu-24.04
    timeout-minutes: 9
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Estimate only unresolved names, never override real race classes
        run: python3 -B scripts/enrich_name_based_classification.py
      - name: Commit confidence-gated estimated labels with no names or identity guesses in logs
        shell: bash
        run: |
          set -euo pipefail
          if git diff --quiet -- docs/data/name-based-classification.json; then
            echo "No additional name-statistical estimates to save"
            exit 0
          fi
          git config user.name "GAX100 Result Audit"
          git config user.email "gax100-release@users.noreply.github.com"
          git add docs/data/name-based-classification.json
          git commit -m "data(gax): confidence-gated estimated first-name categories for unclassified public rows"
          git pull --rebase origin fix/gax100-comprehensive-results-audit-2026-11-20
          git push origin HEAD:fix/gax100-comprehensive-results-audit-2026-11-20
