name: GAX100 Pages
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: gax100-new-pages
  cancel-in-progress: false
jobs:
  deploy:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Test the demo data contract
        if: ${{ hashFiles('docs/data/release-manifest.json') == '' }}
        run: |
          python3 -B tests/test_blueprint_contract.py
          python3 -B tests/test_synthetic_data.py
      - name: Stage and verify the Pages site
        run: python3 -B scripts/build_pages.py --docs docs --out public-preview
      - name: Configure Pages (requires initial repository Pages setup by owner)
        uses: actions/configure-pages@v5
      - name: Upload verified Pages site
        uses: actions/upload-pages-artifact@v4
        with:
          path: public-preview/
          name: gax100-pages-${{ github.run_id }}-${{ github.run_attempt }}
      - name: Deploy GAX100
        id: deployment
        uses: actions/deploy-pages@v4
        with:
          artifact_name: gax100-pages-${{ github.run_id }}-${{ github.run_attempt }}
# Pages has no access to the private source or registry.
