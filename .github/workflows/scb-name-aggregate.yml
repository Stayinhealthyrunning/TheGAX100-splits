name: GAX100 official SCB full-name aggregate inspection
on:
  push:
    branches: [data/gax-scb-name-statistics-2026-11-20]
    paths:
      - .github/workflows/scb-name-aggregate.yml
      - scripts/inspect_scb_workbook.py
      - scripts/enrich_scb_first_names.py
permissions:
  contents: write
jobs:
  scb-aggregate:
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Download official SCB 2022 final full-name aggregate workbook
        shell: bash
        run: |
          set -euo pipefail
          curl --fail --location --retry 2 --retry-delay 2 --max-time 90 \
             --user-agent 'Mozilla/5.0 GAX100 Research (public aggregate names)' \
             'https://www.scb.se/contentassets/9fe7dbb460994c72b835163dbc491ef9/namn-med-minst-tva-barare-31-december-2022.xlsx' \
             -o /tmp/scb_names_2022.xlsx
          test "$(stat -c %s /tmp/scb_names_2022.xlsx)" -gt 10000
          file /tmp/scb_names_2022.xlsx
      - name: Match official population name statistics to already released result IDs
        run: python3 -B scripts/enrich_scb_first_names.py /tmp/scb_names_2022.xlsx
      - name: Commit only per-result ESTIMATED classes, never names or source workbook
        shell: bash
        run: |
          set -euo pipefail
          if git diff --quiet -- docs/data/name-based-classification.json; then
            echo "No new SCB estimate overlays to save"
            exit 0
          fi
          git config user.name "GAX100 SCB Statistical Audit"
          git config user.email "gax100-release@users.noreply.github.com"
          git add docs/data/name-based-classification.json
          git commit -m "data(gax): source-audited SCB 2022 name prevalence estimates"
          git pull --rebase origin data/gax-scb-name-statistics-2026-11-20
          git push origin HEAD:data/gax-scb-name-statistics-2026-11-20
