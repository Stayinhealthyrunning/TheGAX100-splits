name: GAX100 clean-room quality and privacy
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: JavaScript syntax checks
        shell: bash
        run: |
          set -euo pipefail
          for js in docs/assets/*.js; do node --check "$js"; done
      - name: Verify official GAX aggregates and empty public individual-data files
        run: python3 -B tests/test_blueprint_contract.py
      - name: Verify all 945 fictional identities, sexes, splits and cutoff constraints
        run: python3 -B tests/test_synthetic_data.py
      - name: Build synthetic offline GAX review
        run: python3 -B scripts/build_offline_preview.py --docs docs --out preview/GAX100-UI-DEMO.html
      - name: Install browser for actual preview acceptance
        run: |
          python3 -m pip install --disable-pip-version-check playwright==1.56.0
          python3 -m playwright install --with-deps chromium
      - name: Test 390px mobile and 1440px desktop, profiles and comparisons
        run: python3 -B tests/test_offline_preview_browser.py --file preview/GAX100-UI-DEMO.html
      - name: 2026 GPX Kartduell works locally without uploading the course
        run: python3 -B tests/test_gax_gpx_local.py --file preview/GAX100-UI-DEMO.html
      - name: Complete eight-point GAX UX and historic GPX metadata review
        run: python3 -B tests/test_gax_full_ux_review.py --file preview/GAX100-UI-DEMO.html
      - name: Verify only test names in generated output
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          html=Path('preview/GAX100-UI-DEMO.html').read_text(encoding='utf-8')
          assert html.count('fiction-') >= 945
          assert 'DESIGNDEMO' in html
          assert 'ALL NAMES AND TIMES ARE FABRICATED' in html
          assert 'gax100.sqlite' not in html
          print('GAX100_OSTERLEN_PASS: 14 years, 945 synthetic Swedish names, modeled splits, original person data excluded')
          PY
      - name: Make safe, standalone GAX design demo downloadable
        if: github.event_name == 'pull_request' || github.ref == 'refs/heads/main'
        uses: actions/upload-artifact@v4
        with:
          name: GAX100-OSTERLEN-DESIGNDEMO
          path: preview/GAX100-UI-DEMO.html
          if-no-files-found: error
          retention-days: 7
# The uploaded HTML is verified synthetic ONLY. No private registry,
# actual participant files or actual GAX control observations are processed.
